name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Сверить тег с версией в pyproject
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "Тег $tag не совпадает с version=$version в pyproject.toml" >&2
            exit 1
          fi

      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
