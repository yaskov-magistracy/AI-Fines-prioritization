services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fines
      POSTGRES_PASSWORD: fines
      POSTGRES_DB: fines
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fines"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://fines:fines@db:5432/fines
      STORAGE_DIR: /data/storage
      EXTRACTOR_BACKEND: ${EXTRACTOR_BACKEND:-rule_based}
      PRICE_PROVIDER: ${PRICE_PROVIDER:-stub}
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage
    command: >
      sh -c "alembic upgrade head &&
             uvicorn fines.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  storage:
